name: Awesome lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # awesome-lint reads the git history to check the list's age
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes awesome-lint@2.3.0
